<title>QUIET COFFEE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>

/* Layout: light, airy phone column. White and warm-wood surfaces, peach header block, amber actions, dark-chocolate product cards, floating pill nav and action bar. */
:root{
  --bg:#FCFAF7; --bg2:#F3E9DF; --sheet:#F7EEE5; --card:#FFFFFF; --line:#EDE3D9;
  --fg:#4A3A32; --mute:#7A685D; --link:#8A5326;
  --btn:#E8AC6A; --btn-fg:#33231A;
  --wood1:#8F5E3C; --wood2:#6A4128;
  --pale1:#F8EDE2; --pale2:#F0DCC8;
  --tint1:#F1E3D3; --tint2:#EBD9C5;
  --track:rgba(74,58,50,.14); --fill:#C07A36;
  --ok-bg:#E5EDD8; --ok-fg:#3F5530; --warn-bg:#F8E7C9; --warn-fg:#7A4B12;
  --art:#8A5A38; --err:#A33B2A; --focus:#B9702E;
  --shadow:0 8px 22px rgba(120,75,35,.12);
  --gx:max(16px,env(safe-area-inset-left,0px));
  --font:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1511; --bg2:#2B211A; --sheet:#241B15; --card:#2A2019; --line:#3D3026;
    --fg:#F3E8DA; --mute:#BBA792; --link:#E8AC6A;
    --btn:#E8AC6A; --btn-fg:#2A1C12;
    --wood1:#7A5233; --wood2:#5A3A22;
    --pale1:#33261C; --pale2:#3A2C21;
    --tint1:#3A2C21; --tint2:#34271D;
    --track:rgba(255,255,255,.18); --fill:#E8AC6A;
    --ok-bg:#2E3A24; --ok-fg:#BFD6A5; --warn-bg:#4A3820; --warn-fg:#F0CF9A;
    --art:#E1BE93; --err:#F0A08C; --focus:#E1BE93;
    --shadow:0 8px 22px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1511; --bg2:#2B211A; --sheet:#241B15; --card:#2A2019; --line:#3D3026;
  --fg:#F3E8DA; --mute:#BBA792; --link:#E8AC6A;
  --btn:#E8AC6A; --btn-fg:#2A1C12;
  --wood1:#7A5233; --wood2:#5A3A22;
  --pale1:#33261C; --pale2:#3A2C21;
  --tint1:#3A2C21; --tint2:#34271D;
  --track:rgba(255,255,255,.18); --fill:#E8AC6A;
  --ok-bg:#2E3A24; --ok-fg:#BFD6A5; --warn-bg:#4A3820; --warn-fg:#F0CF9A;
  --art:#E1BE93; --err:#F0A08C; --focus:#E1BE93;
  --shadow:0 8px 22px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg2);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.4}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:left}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#shell{max-width:460px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative}
@media (min-width:520px){#shell{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.page{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 130px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2em;font-size:13px}
.logo i{width:36px;height:36px;border-radius:12px;background:var(--wood2);color:#FFF8EE;display:flex;align-items:center;justify-content:center}
.ibtn{width:44px;height:44px;border-radius:22px;background:var(--card);box-shadow:0 2px 8px rgba(120,75,35,.10);display:flex;align-items:center;justify-content:center;flex:none}
.h1{font-size:28px;line-height:1.15;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:6px 0 0;color:var(--mute)}
h2{font-size:19px;margin:0;font-weight:700}
h3{font-size:16px;margin:0 0 10px;font-weight:700}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.link{color:var(--link);font-weight:600;font-size:14px;min-height:44px;display:inline-flex;align-items:center}

/* header block with search (home, coffee, food, welcome) */
.hd{margin:calc(-12px - env(safe-area-inset-top,0px)) calc(-1 * var(--gx)) 0;padding:calc(env(safe-area-inset-top,0px) + 16px) var(--gx) 22px;background:linear-gradient(180deg,var(--pale2),var(--pale1));border-radius:0 0 34px 34px;display:flex;flex-direction:column;gap:16px}
.search{display:flex;align-items:center;justify-content:space-between;gap:10px;height:56px;padding:0 6px 0 20px;border-radius:28px;background:var(--card);box-shadow:var(--shadow);width:100%;text-align:left;color:var(--mute)}
.search:focus-within{outline:3px solid var(--focus)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;height:100%;color:var(--fg)}
.search input::placeholder{color:var(--mute)}
.sbtn{width:44px;height:44px;border-radius:22px;background:var(--bg2);color:var(--fg);display:flex;align-items:center;justify-content:center;flex:none}
.dtabs{display:flex;gap:22px;overflow-x:auto;scrollbar-width:none;margin-inline:calc(-1 * var(--gx));padding-inline:var(--gx)}
.dtabs::-webkit-scrollbar{display:none}
.dtab{height:46px;padding:0 2px;font-weight:600;color:var(--mute);position:relative;white-space:nowrap;text-align:center}
.dtab.on{color:var(--fg);font-weight:700}
.dtab.on::after{content:"";position:absolute;left:50%;bottom:4px;width:7px;height:7px;border-radius:4px;background:var(--btn);transform:translateX(-50%)}

.seg{display:flex;gap:4px;padding:4px;border-radius:18px;background:var(--bg2)}
.seg button{flex:1;height:44px;border-radius:14px;font-weight:600;text-align:center}
.seg .on{background:var(--btn);color:var(--btn-fg)}
.hero{border-radius:26px;padding:20px;color:var(--fg);background-image:repeating-linear-gradient(90deg,rgba(120,80,40,.05) 0 2px,transparent 2px 10px),linear-gradient(135deg,var(--pale1),var(--pale2));display:flex;gap:12px;align-items:center;justify-content:space-between}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
.hero .eyebrow{color:var(--mute)}
.eyebrow.dim{color:var(--mute)}
.big{font-size:44px;font-weight:700;line-height:1.05;margin-top:4px}
.hero p{margin:6px 0 0;font-size:13px}
.btn{height:48px;padding:0 20px;border-radius:24px;background:var(--btn);color:var(--btn-fg);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;white-space:nowrap}
.btn.block{width:100%;height:54px;font-size:17px}
.btn.light{background:var(--btn);color:var(--btn-fg)}
.btn2{height:44px;padding:0 16px;border-radius:22px;background:var(--bg2);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.danger{background:var(--err);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.card{background:var(--card);border-radius:22px;padding:14px;box-shadow:0 2px 10px rgba(120,75,35,.06)}
.item{display:flex;align-items:center;gap:14px;padding:12px;border-radius:22px;background:var(--card);width:100%;box-shadow:0 2px 10px rgba(120,75,35,.06)}
.item.off{opacity:.6;cursor:default}
.thumb{width:64px;height:64px;border-radius:18px;background:var(--tint1);color:var(--art);display:flex;align-items:center;justify-content:center;flex:none}
.thumb.alt{background:var(--tint2)}
.meta{flex:1;min-width:0}
.meta b{display:block;font-size:16px}
.meta span{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.price{font-weight:700}
.badge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:12px;background:var(--ok-bg);color:var(--ok-fg);font-size:12px;font-weight:600;margin-top:6px;white-space:nowrap}
.meta .badge{display:inline-flex;align-items:center;justify-content:center;line-height:1;margin-top:6px;font-size:12px;color:var(--ok-fg)}
.badge.gray{background:var(--bg2);color:var(--mute)}
.badge.warn{background:var(--warn-bg);color:var(--warn-fg)}
.plus{width:44px;height:44px;border-radius:22px;background:var(--btn);color:var(--btn-fg);display:flex;align-items:center;justify-content:center;flex:none}
.list{display:flex;flex-direction:column;gap:10px}
.hrow{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;margin-inline:calc(-1 * var(--gx));padding-inline:var(--gx);scrollbar-width:none}
.hrow::-webkit-scrollbar{display:none}

/* wood + product cards */
.wood{background-image:repeating-linear-gradient(90deg,rgba(70,38,16,.14) 0 1px,transparent 1px 46px),repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 6px),linear-gradient(135deg,#C69869,#A5744A)}
.wood.b{background-image:repeating-linear-gradient(90deg,rgba(70,38,16,.10) 0 1px,transparent 1px 46px),repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 1px,transparent 1px 6px),linear-gradient(135deg,#DDBE98,#C39A70)}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pc{display:flex;flex-direction:column;border-radius:26px;overflow:hidden;background:#48291B;color:#FFF8EE;text-align:left;width:100%;box-shadow:var(--shadow)}
.pc-img{height:150px;display:flex;align-items:center;justify-content:center;flex:none}
.pc-body{display:flex;flex-direction:column;gap:4px;padding:14px 12px 12px;background:linear-gradient(180deg,#6A4430,#48291B);margin-top:-20px;border-radius:22px 22px 0 0;position:relative;flex:1}
.pc-body b{font-size:15px;line-height:1.2}
.pc-d{font-size:12px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.pc-meta{display:flex;gap:10px;font-size:11px;opacity:.92;flex-wrap:wrap;margin-top:2px}
.pc-meta span{display:inline-flex;gap:4px;align-items:center}
.pc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:8px}
.pc-price{font-size:17px;font-weight:700}
.pc-add{width:44px;height:44px;border-radius:22px;background:var(--btn);color:var(--btn-fg);display:flex;align-items:center;justify-content:center;flex:none}
.pc.off{opacity:.62;cursor:default}
.hrow .pc{flex:none;width:176px}

.promo{flex:none;width:220px;border-radius:24px;padding:16px;color:#FFF8EE;min-height:112px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px),linear-gradient(135deg,var(--wood1),var(--wood2))}
.promo b{font-size:17px;line-height:1.2}
.promo span{font-size:13px}
.tag{display:inline-flex;height:22px;align-items:center;padding:0 8px;border-radius:11px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,248,238,.22);color:#FFF8EE;align-self:flex-start}
.pbig{border-radius:26px;padding:18px 20px;color:#FFF8EE;display:flex;flex-direction:column;gap:6px;width:100%;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 2px,transparent 2px 9px),linear-gradient(135deg,var(--wood1),var(--wood2))}
.pbig b{font-size:20px;line-height:1.2}
.pbig span{font-size:14px}
.cd{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;line-height:1.1;margin-top:4px}
.mini{flex:none;width:150px;border-radius:22px;background:var(--card);padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 10px rgba(120,75,35,.06)}
.mini .thumb{width:100%;height:84px}
.mini b{font-size:15px}
.mini span{font-size:13px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border-radius:22px;background:var(--card);padding:14px;display:flex;align-items:center;gap:12px;font-weight:600;box-shadow:0 2px 10px rgba(120,75,35,.06)}
.tile .thumb{width:44px;height:44px;border-radius:14px}
.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;background:var(--ok-bg);color:var(--ok-fg);font-weight:600;width:100%}
.banner span{flex:1}
.sline{display:flex;align-items:center;gap:12px;padding:6px 0}
.sline .thumb{width:48px;height:48px;border-radius:14px}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;flex-wrap:wrap}
.srow div{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-align:center}
.chip.on{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.chip .d{opacity:.8;font-weight:500}
.hint{margin:-4px 0 10px;font-size:13px;color:var(--mute)}

/* item details screen */
.dhero{margin:calc(-12px - env(safe-area-inset-top,0px)) calc(-1 * var(--gx)) 0;height:calc(300px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;justify-content:center;position:relative}
.dtop{position:absolute;left:var(--gx);right:var(--gx);top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;align-items:center;justify-content:space-between}
.dt{font-weight:700;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.gbtn{width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.88);color:#4A3A32;display:flex;align-items:center;justify-content:center}
.sheet{margin:-34px calc(-1 * var(--gx)) 0;padding:24px var(--gx) 130px;background:var(--sheet);border-radius:34px 34px 0 0;position:relative;display:flex;flex-direction:column;gap:18px}
.metaline{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.metaline span{display:inline-flex;align-items:center;gap:5px}

.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:600}
.inp{height:52px;padding:0 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:16px;width:100%;outline:0}
.inp:focus{border-color:var(--fill)}
.inp[disabled]{opacity:.6}
textarea.inp{height:84px;padding:12px 16px;resize:none}
.code{font-size:30px;letter-spacing:.5em;text-align:center;font-weight:700}
.err{color:var(--err);font-size:13px;font-weight:600;min-height:18px}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:500;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--fill);flex:none}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}

/* floating action bar and nav */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(436px,calc(100% - 2 * max(12px,env(safe-area-inset-left,0px))));padding:10px 10px 10px 22px;background:var(--pale2);border-radius:34px;box-shadow:0 10px 30px rgba(74,40,20,.20);display:flex;align-items:center;gap:12px;z-index:5}
.bar .bp{display:flex;flex-direction:column;line-height:1.1;flex:none}
.bar .bp span{font-size:12px;color:var(--mute)}
.bar .bp b{font-size:22px;font-variant-numeric:tabular-nums}
.bar .btn{flex:1;height:54px;font-size:16px}
.stepper{display:flex;align-items:center;gap:2px;background:var(--card);border-radius:22px;padding:2px;box-shadow:0 2px 8px rgba(120,75,35,.10)}
.stepper button{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center}
.stepper b{min-width:20px;text-align:center}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(436px,calc(100% - 2 * max(12px,env(safe-area-inset-left,0px))));padding:6px;background:var(--card);border-radius:36px;box-shadow:0 10px 30px rgba(74,40,20,.20);display:flex;gap:2px;z-index:5}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:500;color:var(--mute);min-height:60px;border-radius:30px;position:relative;text-align:center}
.nav button.on{background:var(--btn);color:var(--btn-fg);font-weight:700}
.cnt{position:absolute;top:4px;left:calc(50% + 6px);min-width:20px;height:20px;border-radius:10px;background:var(--wood2);color:#FFF8EE;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}

.grid6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.cell{height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg);font-weight:600;text-align:center}
.cell.on{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.opt{flex:1;padding:14px;border-radius:22px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.opt.on{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.opt b{font-size:15px}
.opt span{font-size:12px;line-height:1.35;opacity:.85}
.two{display:flex;gap:10px}
.sum{display:flex;flex-direction:column;gap:8px}
.sum div{display:flex;justify-content:space-between;gap:12px}
.sum .tot{font-size:20px;font-weight:700}
.line{display:flex;align-items:flex-start;gap:12px}
.line .meta span{line-height:1.35}
.small{font-size:13px;color:var(--mute)}
.steps{display:flex;align-items:flex-start}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;text-align:center;color:var(--mute);font-weight:500}
.step i{width:32px;height:32px;border-radius:16px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-style:normal}
.step.done i{background:var(--btn);color:var(--btn-fg)}
.step.now i{border:2px solid var(--btn);background:var(--tint1)}
.step.now,.step.done{color:var(--fg);font-weight:700}
.dash{width:18px;height:2px;background:var(--line);margin-top:15px;flex:none}
.dash.done{background:var(--btn)}
.stamps{display:flex;gap:6px;margin-top:10px}
.stamps i{flex:1;height:10px;border-radius:5px;background:var(--track)}
.stamps i.on{background:var(--fill)}
.pbar{height:10px;border-radius:5px;background:var(--track);margin-top:8px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:5px;background:var(--fill)}
.sw{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%}
.sw:last-child{border-bottom:0}
.sw .meta span{line-height:1.35}
.track{width:48px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none}
.track::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:11px;background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw.on .track{background:var(--btn)}
.sw.on .track::after{transform:translateX(20px)}
.avatar{width:56px;height:56px;border-radius:28px;background:var(--wood2);color:#FFF8EE;font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);opacity:0;visibility:hidden;pointer-events:none;width:min(430px,calc(100% - 32px));background:#3F2E25;color:#FFF8EE;border-radius:18px;padding:12px 16px;z-index:50;transition:transform .25s ease,opacity .2s ease,visibility 0s linear .25s}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible;pointer-events:auto;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .25s ease,opacity .2s ease,visibility 0s}
.toast b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:2px}
.empty{text-align:center;padding:40px 12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:14px}
.bigcode{font-size:48px;font-weight:700;letter-spacing:.08em;line-height:1}
.logrow{padding:10px 0;border-bottom:1px solid var(--line)}
.logrow:last-child{border-bottom:0}
.logrow .t{font-size:12px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.logrow .x{margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

function opt(k,id){var a=OPT[k];for(var i=0;i<a.length;i++){if(String(a[i].id)===String(id))return a[i]}return a[0]}
function mi(id){for(var i=0;i<DB.menu.length;i++)if(DB.menu[i].id===id)return DB.menu[i];return null}

function sizeOf(it,cfg){var a=sizesOf(it);for(var i=0;i<a.length;i++){if(a[i].id===cfg.size)return a[i]}return a[0]}
function defCfg(it){return {size:it.def||"M",temp:it.cold?"ice":"hot",strength:"classic",balance:"classic",milk:"std",texture:"light",syrup:"none",topping:"none",sugar:0,note:""}}
function unit(it,cfg){
  if(!isDrink(it))return it.price;
  var p=it.price+sizeOf(it,cfg).d;
  if(cfg.strength==="strong")p+=60;
  if(it.milk)p+=(opt("milk",cfg.milk).d||0);
  p+=(opt("syrup",cfg.syrup).d||0);
  return p;
}
function cfgText(it,cfg){
  var p=[sizeOf(it,cfg).l.split(" · ")[0]];
  p.push(it.cold?opt("ice",cfg.temp).l:opt("temp",cfg.temp).l);
  if(cfg.strength!=="classic")p.push(opt("strength",cfg.strength).l+" кофе");
  if(it.milk){
    if(cfg.balance!=="classic")p.push(opt("balance",cfg.balance).l.toLowerCase());
    if(cfg.milk!=="std")p.push(opt("milk",cfg.milk).l+" молоко");
    if(cfg.texture!=="light")p.push(opt("texture",cfg.texture).l.toLowerCase());
  }
  if(cfg.syrup!=="none")p.push("сироп: "+opt("syrup",cfg.syrup).l.toLowerCase());
  if(cfg.topping!=="none")p.push(opt("topping",cfg.topping).l.toLowerCase());
  if(Number(cfg.sugar)>0)p.push("сахар: "+cfg.sugar);
  return p.join(" · ");
}

/* ---------- loyalty ---------- */
function tiers(){return DB.loy.tiers}
function tierIdx(u){var t=tiers(),k=0;for(var i=0;i<t.length;i++)if(u.spent>=t[i].min)k=i;return k}
function tierOf(u){return tiers()[tierIdx(u)]}
function multNow(){var L2=DB.loy,d=new Date().getDay();return (L2.bonusDay>=0&&d===L2.bonusDay)?L2.bonusMult:1}
var DAYS=["Воскресенье","Понедельник","Вторник","Среда","Четверг","Пятница","Суббота"];
function addStamps(u,n){
  var N=DB.loy.freeEvery;
  if(n<0){u.stamps=Math.max(0,u.stamps+n);return}
  u.stamps+=n;
  if(N>0){while(u.stamps>=N){u.stamps-=N;u.freeDrinks+=1}}
}
function calcPay(){
  var u=me(),base=linesTotal(S.cart),LY=DB.loy,cheap=null;
  S.cart.forEach(function(l){var it=mi(l.id);if(it&&isDrink(it)){var p=unit(it,l.cfg);if(cheap===null||p<cheap)cheap=p}});
  var freeOk=u.freeDrinks>0&&cheap!==null&&LY.freeEvery>0;
  var free=(S.useFree&&freeOk)?(LY.freeCap>0?Math.min(cheap,LY.freeCap):cheap):0;
  var after=base-free;
  var maxPts=Math.max(0,Math.min(u.points,Math.floor(after*LY.maxPayPct/100)));
  var pts=S.usePts?maxPts:0;
  var cash=after-pts,tier=tierOf(u),mult=multNow();
  var earn=Math.floor(cash*tier.pct/100*mult);
  return {base:base,free:free,freeOk:freeOk,cheap:cheap,maxPts:maxPts,pts:pts,cash:cash,tip:S.tip,pay:cash+S.tip,earn:earn,tier:tier,mult:mult};
}

/* ---------- v4: QR ---------- */
function qrSvg(text,px){
  if(typeof qrcode!=="function")return '<div class="small" style="line-height:1.3;padding:8px;width:'+px+'px;color:#555">QR не загрузился. Проверьте интернет.</div>';
  try{
    var q=qrcode(0,"M");q.addData(String(text));q.make();
    var n=q.getModuleCount(),m=3,d="";
    for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(q.isDark(r,c))d+="M"+(c+m)+" "+(r+m)+"h1v1h-1z";
    return '<svg xmlns="http://www.w3.org/2000/svg" width="'+px+'" height="'+px+'" viewBox="0 0 '+(n+2*m)+' '+(n+2*m)+'" shape-rendering="crispEdges" role="img" aria-label="QR-код"><rect width="100%" height="100%" fill="#fff"/><path d="'+d+'" fill="#000"/></svg>';
  }catch(e){return '<div class="small" style="padding:8px;color:#555">Не удалось построить QR.</div>'}
}
function tableOfCode(txt){
  var c=DB.tables.codes,t=String(txt||"").trim().toLowerCase();
  if(!t)return 0;
  for(var n in c){if(String(c[n]).trim().toLowerCase()===t)return Number(n)}

/* ---------- v4: QR scanner (live camera when the page may use it, photo otherwise) ---------- */
var SC={on:false,stream:null,timer:0,purpose:null,det:null,cv:null};
function scMsg(t){var e=$("#scM");if(e)e.textContent=t}
function openScan(p){
  SC.purpose=p;SC.on=true;SC.photo=false;
  $("#scT").textContent=p.type==="bind"?"QR для столика № "+p.n:p.type==="test"?"Проверка сканера":"QR на вашем столе";
  $("#scC").value="";
  var box=$("#scan");box.hidden=false;box.classList.add("nocam");
  scMsg("Запрашиваем доступ к камере…");
  var md=navigator.mediaDevices;
  if(!md||!md.getUserMedia){noCam("Камера недоступна в этом окне.");return}
  md.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}).then(function(st){
    if(!SC.on){st.getTracks().forEach(function(t){t.stop()});return}
    SC.stream=st;
    var v=$("#scV");v.srcObject=st;var pr=v.play();if(pr&&pr.catch)pr.catch(function(){});
    box.classList.remove("nocam");scMsg("Наведите камеру на QR-код");
    SC.timer=setTimeout(scLoop,200);
  }).catch(function(){noCam("Нет доступа к камере.")});
}
function noCam(m){if(SC.photo)return;scMsg(m+" Нажмите кнопку ниже: откроется камера телефона, сфотографируйте QR, и мы распознаем его по снимку.")}
function closeScan(){
  SC.on=false;clearTimeout(SC.timer);
  if(SC.stream){SC.stream.getTracks().forEach(function(t){t.stop()});SC.stream=null}
  var v=$("#scV");if(v)v.srcObject=null;
  var b=$("#scan");if(b)b.hidden=true;
}
function decodeSource(src,w,h,max,cb){
  function viaJs(){
    if(typeof jsQR!=="function")return null;
    var k=Math.min(1,max/Math.max(w,h)),cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k));
    var cv=SC.cv||(SC.cv=document.createElement("canvas"));cv.width=cw;cv.height=ch;
    var cx=cv.getContext("2d",{willReadFrequently:true});cx.drawImage(src,0,0,cw,ch);
    var im=cx.getImageData(0,0,cw,ch),r=jsQR(im.data,cw,ch,{inversionAttempts:"attemptBoth"});
    return r?r.data:null;
  }
  if("BarcodeDetector" in window){
    try{
      if(!SC.det)SC.det=new BarcodeDetector({formats:["qr_code"]});
      SC.det.detect(src).then(function(r){var t=r&&r[0]?r[0].rawValue:null;cb(t||viaJs())}).catch(function(){cb(viaJs())});
      return;
    }catch(e){}
  }
  cb(viaJs());
}
function scLoop(){
  if(!SC.on||!SC.stream)return;
  var v=$("#scV");
  if(v.readyState>=2&&v.videoWidth){
    decodeSource(v,v.videoWidth,v.videoHeight,640,function(t){
      if(!SC.on)return;
      if(t)scResult(t);else SC.timer=setTimeout(scLoop,140);
    });
  }else SC.timer=setTimeout(scLoop,200);
}
function scRetry(msg){
  scMsg(msg);
  if(SC.stream)SC.timer=setTimeout(function(){if(SC.on){scMsg("Наведите камеру на QR-код");scLoop()}},1800);
}
function scResult(txt){
  var p=SC.purpose||{type:"order"},n=p.type==="order"?0:tableOfCode(txt);
  if(p.type==="order"){
    api("POST","/api/table/resolve",{code:String(txt)}).then(function(r){
      closeScan();S.table=r.n;S.mode="hall";S.serve="table";me().prefs.table=r.n;
      L("order","Отсканировал QR столика № "+r.n);save();render();
      toast("Столик № "+r.n+" найден по QR. Заказ принесём к нему.");
    }).catch(function(e){if(onApiError(e))return;scRetry(e.code==="no_table"?"Это не QR столика QUIET COFFEE. Попробуйте другой.":e.message)});
    return;
  }
  if(p.type==="bind"){
    var other=tableOfCode(txt);
    if(other&&other!==p.n){scRetry("Этот QR уже привязан к столику № "+other+".");return}
    DB.tables.codes[p.n]=String(txt).trim().slice(0,200);
    L("tables","Привязал свой QR к столику № "+p.n);save();closeScan();render();
    toast("QR привязан к столику № "+p.n+".");return;
  }
  if(!n){scRetry("Это не QR столика QUIET COFFEE. Попробуйте другой.");return}
  closeScan();
  if(p.type==="test"){toast("QR распознан: столик № "+n+".");return}
  S.table=n;S.mode="hall";S.serve="table";me().prefs.table=n;
  L("order","Отсканировал QR столика № "+n);save();render();
  toast("Столик № "+n+" найден по QR. Заказ принесём к нему.");
}
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id!=="scFile")return;
  var f=t.files&&t.files[0];if(!f)return;
  SC.photo=true;scMsg("Распознаём снимок…");
  var url=URL.createObjectURL(f),img=new Image();
  img.onload=function(){
    decodeSource(img,img.naturalWidth,img.naturalHeight,1400,function(txt){
      URL.revokeObjectURL(url);
      if(txt)scResult(txt);else scMsg("QR на снимке не найден. Снимите ближе и ровнее, чтобы код был в центре кадра.");

function topPick(u,k){

function saleMatch(s,q){
  if(!q)return true;
  var m=q.match(/^(\d+)\s*[-–]\s*(\d+)$/);
  if(m){var a=Number(m[1]),b=Number(m[2]);return s.total>=Math.min(a,b)&&s.total<=Math.max(a,b)}
  if(/^\d+$/.test(q))return String(s.total).indexOf(q)>=0||s.id.toLowerCase().indexOf(q)>=0||(q.length>=4&&s.phone.indexOf(q)>=0);
  return (s.name+" "+s.id+" "+s.items.map(function(i){return i.name}).join(" ")).toLowerCase().indexOf(q)>=0;
}

  });
  r.exp=DB.expenses.filter(function(e){return e.ts>=st}).reduce(function(a,e){return a+e.sum},0);

}
function pStart(per){var d=new Date();d.setHours(0,0,0,0);return per==="today"?d.getTime():per==="all"?0:Date.now()-Number(per)*864e5}
function series(per){
  var d0=new Date();d0.setHours(0,0,0,0);var sod=d0.getTime(),b=[],i,n,t;
  if(per==="today"){for(i=0;i<24;i++)b.push({t:sod+i*36e5,e:sod+(i+1)*36e5,l:String(i),v:0})}
  else if(per==="7"||per==="14"||per==="30"){n=Number(per);for(i=n-1;i>=0;i--){t=sod-i*864e5;b.push({t:t,e:t+864e5,l:String(new Date(t).getDate()),v:0})}}
  else{for(i=25;i>=0;i--){t=sod-i*7*864e5;var dt=new Date(t);b.push({t:t,e:t+7*864e5,l:pad(dt.getDate())+"."+pad(dt.getMonth()+1),v:0})}}
  DB.sales.forEach(function(s){for(var j=0;j<b.length;j++){if(s.ts>=b[j].t&&s.ts<b[j].e){b[j].v+=s.total;break}}});
  return b;
}

function barChart(b){

  var ph=H-pt-pb,bw=(W-pl-pr)/n,g="",i;

function rtItem(id){return id==="_shop"?{id:"_shop",name:"Кофейня QUIET COFFEE"}:mi(id)}
function pendingRate(u){
  if(!u||!u.orders)return null;
  for(var i=0;i<u.orders.length;i++){
    var o=u.orders[i];
    if(o.rateDone)continue;
    if(Date.now()-o.ts>12*36e5)return null;

}

/* ---------- v8: shifts, order window, staff pay ---------- */
function snow(){return Date.now()+(SRV.off||0)}
function cts(t){return t-(SRV.off||0)}
function two(n){return (n<10?"0":"")+n}
function hm(t){var d=new Date(t);return two(d.getHours())+":"+two(d.getMinutes())}
function dm(t){var d=new Date(t);return two(d.getDate())+"."+two(d.getMonth()+1)}
var DOW=["вс","пн","вт","ср","чт","пт","сб"];
function dlabel(t){return DOW[new Date(t).getDay()]+" "+dm(t)}
function hrs(ms){return (Math.round(ms/36e5*10)/10).toString().replace(".",",")+" ч"}
function rub2(n){return (Math.round(n*100)/100).toLocaleString("ru-RU",{maximumFractionDigits:2})+" ₽"}
function mmss(ms){var neg=ms<0;ms=Math.abs(ms);return (neg?"+":"")+two(Math.floor(ms/6e4))+":"+two(Math.floor(ms%6e4/1000))}
function effEnd(s){return s.end+(s.ot||[]).reduce(function(a,o){return a+o.min},0)*6e4}
function shiftsSorted(){return (DB.shifts||[]).filter(function(s){return s.status!=="deleted"}).sort(function(a,b){return a.start-b.start})}
function activeShift(){var l=DB.shifts||[];for(var i=0;i<l.length;i++)if(l[i].status==="active")return l[i];return null}
function canStartShift(s){var t=snow();return s.status==="planned"&&t>=s.start-10*6e4&&t<effEnd(s)}
var LATE_MSG=["","Заказ чуть-чуть задерживается. Приносим свои извинения.","Заказ вот-вот будет. Мы делаем всё возможное, чтобы он был у вас как можно быстрее."];
function waitLimit(){return ((DB.pay&&DB.pay.waitLimit)||5)*6e4}
function lateLevel(o){
  if(!o||o.stage>=2||o.stage===undefined)return 0;
  var t=snow();
  if(o.stage===1&&o.due){var x=t-o.due;return x>2*6e4?2:x>0?1:0}
  if(o.stage===0){var w=t-o.ts,wl=waitLimit();return w>wl+3*6e4?2:w>wl?1:0}
  return 0;
}
function syncOrder(){
  var u=me(),o=u&&u.orders&&u.orders[0];
  if(!o||o.stage===undefined){S.order=null;return}
  if(o.stage>=2&&o.readyAt&&snow()-o.readyAt>3*6e4){S.order=null;return}
  var same=S.ws&&S.ws.id===o.id;
  if(same&&S.ws.st!==o.stage){
    if(o.stage===1)toast("Заказ "+o.id+" взяли в работу. Готовим"+(o.baristaName?" · "+o.baristaName:"")+".","QUIET COFFEE");
    if(o.stage===2)toast(o.mode==="hall"&&o.serve==="table"?"Заказ "+o.id+" готов. Несём на столик № "+o.table+".":"Заказ "+o.id+" готов. Заберите на стойке выдачи, код "+o.id.split("-")[1]+".","QUIET COFFEE");
  }
  S.ws={id:o.id,st:o.stage,lv:same&&S.ws.st===o.stage?S.ws.lv:0};
  S.order=o;
}

}

    S.confirm=null;save();render();toast("Демо-данные удалены.");
  },
  tierAdd:function(){var t=S.loyd.tiers,last=t[t.length-1];t.push({name:"Новый уровень",min:(Number(last.min)||0)+5000,pct:Math.min(100,(Number(last.pct)||0)+1)});render()},
  tierDel:function(d){S.loyd.tiers.splice(Number(d.i),1);render()},
  loySave:function(){
    if(!need("loyalty"))return;
    var d=S.loyd,fail=function(m){var e=$("#loyerr");if(e)e.textContent=m};
    var num=function(v){return Number(v)};
    var tr=d.tiers.map(function(t){return {name:String(t.name||"").trim(),min:num(t.min),pct:num(t.pct)}});
    for(var i=0;i<tr.length;i++){
      if(!tr[i].name)return fail("У каждого уровня должно быть название.");
      if(!(tr[i].min>=0)||!(tr[i].pct>=0&&tr[i].pct<=100))return fail("Проверьте суммы и проценты: кэшбэк от 0 до 100.");
    }
    tr[0].min=0;
    tr.sort(function(a,b){return a.min-b.min});
    for(var j=1;j<tr.length;j++)if(tr[j].min===tr[j-1].min)return fail("Суммы уровней не должны совпадать.");
    var o={welcome:num(d.welcome),freeEvery:num(d.freeEvery),freeCap:num(d.freeCap),maxPayPct:num(d.maxPayPct),bonusDay:num(d.bonusDay),bonusMult:num(d.bonusMult)};
    if(!(o.welcome>=0)||!(o.freeEvery>=0)||!(o.freeCap>=0))return fail("Числа не могут быть отрицательными.");
    if(!(o.maxPayPct>=0&&o.maxPayPct<=100))return fail("Доля оплаты баллами: от 0 до 100%.");
    if(!(o.bonusMult>=1))return fail("Множитель не меньше 1.");
    o.freeEvery=Math.round(o.freeEvery);
    DB.loy=Object.assign({},o,{tiers:tr});
    L("loyalty","Изменил систему лояльности: уровней "+tr.length+", подарок каждый "+o.freeEvery+"-й, баллами до "+o.maxPayPct+"%, приветственный бонус "+o.welcome);
    S.loyd=clone(DB.loy);save();render();toast("Правила лояльности сохранены.");
  }
};
function applyTheme(){
  var r=document.documentElement;
  if(DB.theme==="light"||DB.theme==="dark")r.setAttribute("data-theme",DB.theme);else r.removeAttribute("data-theme");
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
  var t=e.target.closest("[data-a]");if(!t)return;
  var a=actions[t.getAttribute("data-a")];if(!a)return;
  if(t.getAttribute("type")==="submit")return;
  a(t.dataset,t);
});
document.addEventListener("submit",function(e){
  e.preventDefault();
  if(e.target.id==="regform")actions.sendcode();
});
function draftBase(){
  if(S.screen==="rateord"&&S.ro)return S.ro;
  if(S.df&&(S.screen==="profile"||S.screen==="reviews"))return S.df.draft;
  if(S.screen!=="panel")return null;
  if(S.pf)return S.pf.draft;
  if(S.ptab==="shifts")return S.shd||(S.shd=shdDef());
  if(S.ptab==="staff")return S.payd||(S.payd=clone(DB.pay));
  if(S.ptab==="loy")return S.loyd;
  if(S.ptab==="tables")return S.td||(S.td={count:DB.tables.count});
  return null;
}
function setPath(o,p,v){var k=p.split(".");for(var i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v}
function keepFocus(id){
  var el=document.getElementById(id);if(!el)return;
  el.focus();try{var n=el.value.length;el.setSelectionRange(n,n)}catch(x){}
}
function syncDraft(t){
  var b=draftBase();if(!b)return;
  var v=t.type==="checkbox"?t.checked:t.value;
  if(t.hasAttribute("data-num"))v=(v===""?"":Number(v));
  setPath(b,t.getAttribute("data-d"),v);
}
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.hasAttribute("data-d")){syncDraft(t);return}
  if(t.id==="nm")S.reg.name=t.value;
  else if(t.id==="ph")S.reg.phone=t.value;
  else if(t.id==="cd"){S.code=t.value.replace(/\D/g,"").slice(0,6);t.value=S.code;if(S.code.length===6)verify()}
  else if(t.id==="tcode"){var c1=t.value.replace(/\D/g,"").slice(0,6);t.value=c1;if(c1.length===6){api("POST","/api/auth/totp",{code:c1}).then(function(){startSession(false)}).catch(function(e){if(onApiError(e))return;t.value="";var m=$("#regerr");if(m)m.textContent=e.message})}}
  else if(t.id==="stc"){S.step.code=t.value.replace(/\D/g,"").slice(0,6);t.value=S.step.code;if(S.step.code.length===6)submitStep()}
  else if(t.id==="ekey")S.en.key=t.value;
  else if(t.id==="ecode"){S.en.code=t.value.replace(/\D/g,"").slice(0,6);t.value=S.en.code}
  else if(t.id==="note"&&S.cz)S.cz.cfg.note=t.value;
  else if(t.id==="cmt")S.comment=t.value;
  else if(t.id==="pq"){S.pq=t.value;render();keepFocus("pq")}
  else if(t.id==="lq"){S.lq=t.value;render();keepFocus("lq")}
  else if(t.id==="sg"){S.sg=t.value;render();keepFocus("sg")}
  else if(t.id==="sq"){S.sq=t.value;render();keepFocus("sq")}
  else if(t.id==="sf"){S.sf=t.value;render();keepFocus("sf")}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.hasAttribute("data-d")){syncDraft(t);if(t.hasAttribute("data-r"))render()}
});

/* ---------- countdown ticker ---------- */
setInterval(function(){
  var els=document.querySelectorAll("[data-cd]"),expired=false;
  for(var i=0;i<els.length;i++){
    var left=Number(els[i].getAttribute("data-cd"))-Date.now();
    if(left<=0)expired=true;else els[i].textContent=fmtLeft(left);
  }
  if(expired&&S.screen==="home")render();
  var mm=document.querySelectorAll("[data-mm]");
  for(var j=0;j<mm.length;j++)mm[j].textContent=mmss(Number(mm[j].getAttribute("data-mm"))-Date.now());
  var ag=document.querySelectorAll("[data-ago]");
  for(var k=0;k<ag.length;k++)ag[k].textContent=Math.max(0,Math.floor((Date.now()-Number(ag[k].getAttribute("data-ago")))/6e4));
  var fl=document.querySelectorAll("[data-flip]"),flip=false;
  for(var m=0;m<fl.length;m++)if(Date.now()>=Number(fl[m].getAttribute("data-flip")))flip=true;
  if(flip&&(S.screen==="queue"||S.screen==="status"))render();
  if(S.order&&S.ws&&S.ws.id===S.order.id){
    var lv=lateLevel(S.order);
    if(lv>S.ws.lv){S.ws.lv=lv;toast(LATE_MSG[lv],"QUIET COFFEE");if(S.screen==="status"||S.screen==="home")render()}
  }
},1000);

/* ---------- start ---------- */
DB=emptyDB();applyTheme();S.screen="boot";render();
api("GET","/api/session").then(function(r){
  if(r.auth){startSession(false);return}
  if(r.pend==="totp"){S.tf={code:"",err:""};S.screen="totp"}
  else if(r.pend==="enroll"){S.en={key:"",secret:"",uri:"",code:"",err:""};S.enRole=r.role;S.screen="enroll"}
  else S.screen="welcome";
  render();
}).catch(function(e){if(!onApiError(e)){S.screen="welcome";render();toast(e.message)}});
})();
</script>
